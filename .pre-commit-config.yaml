repos:
  - repo: local
    hooks:
      - id: build-site
        name: Build generated site outputs
        entry: uv run python scripts/build_site.py
        language: system
        pass_filenames: false
      - id: update-candidates
        name: Check update candidate listing
        entry: uv run python scripts/list_update_candidates.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Run unit tests
        entry: uv run python -B -m unittest discover -s tests
        language: system
        pass_filenames: false
