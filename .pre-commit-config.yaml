repos:
  - repo: local
    hooks:
      - id: build-site
        name: Build generated site outputs
        entry: uv run industrial-events-build-site
        language: system
        pass_filenames: false
      - id: update-candidates
        name: Check update candidate listing
        entry: uv run industrial-events-list-candidates
        language: system
        pass_filenames: false
      - id: check-new-yaml-links
        name: Check links in newly added YAML
        entry: uv run industrial-events-check-yaml-links
        language: system
        pass_filenames: false
      - id: check-duplicate-event-urls
        name: Check duplicate top-level event URLs
        entry: uv run industrial-events-check-duplicate-event-urls
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Run unit tests
        entry: uv run python -B -m unittest discover -s tests
        language: system
        pass_filenames: false
