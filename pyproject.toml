[project]
name = "industrial-events"
version = "0.1.0"
description = "Source-first event tracking with generated static site, RSS, and iCalendar feeds."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
industrial-events-build-dataset = "industrial_events.cli.build_dataset:main"
industrial-events-build-site = "industrial_events.cli.build_site:main"
industrial-events-check-duplicate-event-urls = "industrial_events.cli.check_duplicate_event_urls:main"
industrial-events-check-yaml-links = "industrial_events.cli.check_yaml_links:main"
industrial-events-link-targets = "industrial_events.cli.link_targets:main"
industrial-events-list-candidates = "industrial_events.cli.list_candidates:main"
industrial-events-update-event = "industrial_events.cli.update_event:main"
industrial-events-update-readme = "industrial_events.cli.update_readme:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "graphifyy>=0.7.10",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
