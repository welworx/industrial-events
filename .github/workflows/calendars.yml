name: calendars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run python scripts/build_calendars.py
      - name: Check generated docs are committed
        run: |
          git diff --exit-code -- README.md public/conferences.md public/conferences
          untracked="$(git ls-files --others --exclude-standard -- README.md public/conferences.md public/conferences)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated docs:"
            echo "$untracked"
            exit 1
          fi
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python -B -m unittest discover -s tests
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
